name: Encoding boundary audit
on:
  push:
    branches: [audit/pr85-encoding-20261003]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encoding:
    name: ${{ matrix.variant }} on ${{ matrix.os }} ${{ matrix.locale }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            os: ubuntu-latest
            locale: C.UTF-8
            repository: connbot/coding-tools-mcp
            revision: 91f60e2604d3b3aa69e675d1b1fce06aa4a116b8
          - variant: baseline
            os: windows-latest
            locale: Chinese_China.936
            repository: connbot/coding-tools-mcp
            revision: 91f60e2604d3b3aa69e675d1b1fce06aa4a116b8
          - variant: baseline
            os: windows-latest
            locale: English_United States.1252
            repository: connbot/coding-tools-mcp
            revision: 91f60e2604d3b3aa69e675d1b1fce06aa4a116b8
          - variant: pr85
            os: ubuntu-latest
            locale: C.UTF-8
            repository: KetenBieber/coding-tools-mcp
            revision: 3320a5608d17f2eea8dbf3038801a8cc8a6eec15
          - variant: pr85
            os: windows-latest
            locale: Chinese_China.936
            repository: KetenBieber/coding-tools-mcp
            revision: 3320a5608d17f2eea8dbf3038801a8cc8a6eec15
          - variant: pr85
            os: windows-latest
            locale: English_United States.1252
            repository: KetenBieber/coding-tools-mcp
            revision: 3320a5608d17f2eea8dbf3038801a8cc8a6eec15
    env:
      CODING_TOOLS_MCP_TELEMETRY: 'off'
      PYTHONIOENCODING: utf-8
      AUDIT_RUNTIME: subject
      AUDIT_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@v6.0.2
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'
      - name: Install real search tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fd-find ripgrep
      - name: Install real search tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install fd ripgrep --yes --no-progress
      - name: Install runtime
        run: python -m pip install -e ./subject
      - name: Probe real byte boundaries
        shell: bash
        run: python -X utf8=0 tests/test_encoding_audit.py 2>&1 | tee encoding-results.txt
      - name: Save evidence including failures
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: encoding-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.locale }}
          path: encoding-results.txt
          if-no-files-found: warn
          retention-days: 14
